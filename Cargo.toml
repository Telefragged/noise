[workspace]
members = ["crates/noise", "crates/noise-store"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
iroh = "1.4.1"
iroh-base = { version = "1.4.1", default-features = false, features = ["key"] }
iroh-gossip = "0.101.0"
noise-store = { path = "crates/noise-store" }
rand = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# An `expect` names what failed; an `unwrap` panics without a word. Not
# `forbid`: clap's derive macros emit `#[allow(clippy::restriction)]`,
# which a `forbid` rejects.
unwrap_used = "deny"

# A suppression must be an #[expect], which fails when the lint no longer
# fires, with a `reason`.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[workspace.lints.rust]
# Warnings are errors in every build: local `cargo` and the nix build alike.
warnings = "deny"
