[workspace]
members = [
  "crates/noise",
  "crates/noise-room",
  "crates/noise-net",
  "crates/noise-store",
]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
include_dir = "0.7"
iroh = "1.4.1"
iroh-base = { version = "1.4.1", default-features = false, features = ["key"] }
iroh-gossip = "0.102.0"
iroh-mdns-address-lookup = "0.6"
n0-future = "0.3"
noise-net = { path = "crates/noise-net" }
noise-room = { path = "crates/noise-room" }
noise-store = { path = "crates/noise-store" }
postcard = { version = "1", features = ["use-std"] }
rand = "0.10"
rustix = { version = "1", features = ["event", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.9"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# An `expect` names what failed; an `unwrap` panics without a word. Not
# `forbid`: clap's derive macros emit `#[allow(clippy::restriction)]`,
# which a `forbid` rejects.
unwrap_used = "deny"

# A suppression must be an #[expect], which fails when the lint no longer
# fires, with a `reason`.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[workspace.lints.rust]
# Warnings are errors in every build: local `cargo` and the nix build alike.
warnings = "deny"
