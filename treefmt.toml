# Repo-wide formatting: `nix develop -c treefmt` (or `nix fmt`). Every
# formatter binary comes from the devShell (flake.nix), so results are
# pinned and identical for every contributor. treefmt skips gitignored
# paths but formats untracked files.

[formatter.rust]
command = "rustfmt"
options = ["--edition", "2024"]
includes = ["*.rs"]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]
# Generated by `crate2nix generate`, which would undo any reformatting at
# the next regeneration.
excludes = ["Cargo.nix"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.json", "*.md", "*.yml", "*.yaml"]

[formatter.shell]
command = "shfmt"
options = ["-i", "2", "-w"]
includes = ["*.sh"]

[formatter.toml]
command = "taplo"
options = ["format"]
includes = ["*.toml"]
